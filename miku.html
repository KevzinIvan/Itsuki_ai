<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miku Nakano — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F4F7FB;
      --bg-card: #FFFFFF;
      --bg-chat: #FAFCFE;
      --border-color: #DDE6F1;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --accent-blue: #3B82F6;
      --accent-blue-hover: #2563EB;
      --accent-blue-light: #EFF6FF;
      --user-bubble: #1E293B;
      --user-text: #FFFFFF;
      --bot-bubble: #FFFFFF;
      --bot-text: #1E293B;

      --emotion-idle-bg: #E2E8F0;
      --emotion-idle-text: #475569;
      --emotion-cheerful-bg: #FEF3C7;
      --emotion-cheerful-text: #92400E;
      --emotion-blushing-bg: #FCE7F3;
      --emotion-blushing-text: #9D174D;
      --emotion-pouting-bg: #E0E7FF;
      --emotion-pouting-text: #3730A3;
      --emotion-sad-bg: #F1F5F9;
      --emotion-sad-text: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      height: 90dvh;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(30, 41, 59, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Mobile Configuration (HP) - Scaled to fit 100% full content */
    @media (max-width: 640px) {
      body {
        padding: 0;
      }
      .app-container {
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        border: none;
      }
      .header {
        padding: 6px 8px;
        gap: 4px;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .character-info {
        gap: 4px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      .back-nav-btn {
        padding: 2px 5px;
        font-size: 0.75rem;
        flex-shrink: 0;
      }
      .avatar-wrapper {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        aspect-ratio: 1 / 1;
      }
      .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        aspect-ratio: 1 / 1;
        flex-shrink: 0;
      }
      .character-details {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      .character-details h2 {
        font-size: clamp(0.7rem, 3.2vw, 0.8rem);
        white-space: nowrap;
        overflow: visible;
        text-overflow: clip;
        margin: 0;
        line-height: 1.1;
        flex-shrink: 0;
      }
      .creator-badge {
        display: none;
      }
      .subtitle {
        display: block;
        font-size: clamp(0.5rem, 2.2vw, 0.58rem);
        white-space: nowrap;
        overflow: visible;
        text-overflow: clip;
        max-width: none;
        margin-top: 1px;
        line-height: 1.1;
      }
      .header-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .icon-btn {
        padding: 2px 5px;
        font-size: 0.62rem;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .emotion-badge {
        padding: 2px 5px;
        font-size: 0.62rem;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .chat-messages {
        padding: 12px 10px;
      }
      .message-row {
        max-width: 90%;
      }
      .footer {
        padding: 8px 10px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
    }

    /* Header styling */
    .header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
    }

    .character-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #60A5FA);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border: 2px solid #FFFFFF;
    }

    .headphone-clip {
      position: absolute;
      top: -2px;
      right: -2px;
      font-size: 14px;
    }

    .character-details h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .creator-badge {
      font-size: 0.72rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      background: var(--accent-blue-light);
      color: var(--accent-blue);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .back-nav-btn {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      line-height: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .emotion-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      background-color: var(--emotion-idle-bg);
      color: var(--emotion-idle-text);
      text-transform: capitalize;
    }

    .audio-visualizer {
      display: none;
      align-items: center;
      gap: 3px;
      height: 16px;
    }

    .audio-visualizer.active {
      display: flex;
    }

    .audio-bar {
      width: 3px;
      height: 100%;
      background-color: var(--accent-blue);
      border-radius: 2px;
      animation: bounce 1s infinite ease-in-out alternate;
    }

    .audio-bar:nth-child(2) { animation-delay: 0.2s; }
    .audio-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      background: var(--bg-main);
      color: var(--text-main);
      border-color: #CBD5E1;
    }

    /* Chat Messages */
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin: 20px auto;
      max-width: 500px;
    }

    .welcome-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .welcome-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .chip {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: var(--accent-blue-light);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-sender {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.93rem;
      line-height: 1.5;
      position: relative;
      word-wrap: break-word;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .bubble {
      background: var(--bot-bubble);
      color: var(--bot-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .play-audio-btn {
      margin-top: 6px;
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .play-audio-btn:hover {
      background: var(--accent-blue-light);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      gap: 5px;
      align-items: center;
    }

    .typing-indicator.active {
      display: flex;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Footer */
    .footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background: #FFFFFF;
    }

    .input-container {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s ease;
    }

    .input-container:focus-within {
      border-color: var(--accent-blue);
      background: #FFFFFF;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text-main);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .send-btn:hover {
      background: var(--accent-blue-hover);
    }

    .send-btn:active {
      transform: scale(0.97);
    }

    .send-btn:disabled {
      background: #CBD5E1;
      cursor: not-allowed;
    }

    .credit-tag {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .credit-tag span {
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="character-info">
        <a href="selections.html" class="icon-btn back-nav-btn" title="Back to Selection">
          ←
        </a>
        <div class="avatar-wrapper">
          <img src="/miku.jpg" alt="Miku Nakano" class="avatar-img">
          <span class="headphone-clip">🎧</span>
        </div>
        <div class="character-details">
          <h2>Miku Nakano <span class="creator-badge">Made by Kevin</span></h2>
          <div class="subtitle">3rd Sister • History Enthusiast</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="audio-visualizer" id="audioVisualizer" title="Speaking...">
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
        </div>

        <div class="emotion-badge" id="emotionBadge">
          <span id="emotionIcon">🎧</span>
          <span id="emotionText">idle</span>
        </div>

        <button class="icon-btn" id="resetBtn" title="Reset Conversation">
          ↻ Reset
        </button>
      </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-card" id="welcomeCard">
        <h3>Talk with Miku Nakano</h3>
        <p>Ask her about Japanese Sengoku warlords, matcha soda, or study strategies!</p>
        <div class="suggestion-chips">
          <button class="chip" onclick="sendPrompt('Hello Miku! How are you?')">Hello Miku!</button>
          <button class="chip" onclick="sendPrompt('Who is your favorite Sengoku warlord?')">Favorite warlord?</button>
          <button class="chip" onclick="sendPrompt('Do you like matcha green tea?')">Matcha soda?</button>
          <button class="chip" onclick="sendPrompt('Can you help me study history?')">Study history?</button>
        </div>
      </div>

      <div class="typing-indicator" id="typingIndicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Input Form -->
    <div class="footer">
      <div class="input-container">
        <input type="text" id="userInput" placeholder="Type a message to Miku..." autocomplete="off">
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
      <div class="credit-tag">Made by <span>Kevin</span></div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const emotionBadge = document.getElementById('emotionBadge');
    const emotionIcon = document.getElementById('emotionIcon');
    const emotionText = document.getElementById('emotionText');
    const resetBtn = document.getElementById('resetBtn');
    const welcomeCard = document.getElementById('welcomeCard');
    const audioVisualizer = document.getElementById('audioVisualizer');

    let currentAudio = null;

    const emotionConfig = {
      idle: { icon: '🎧', bg: 'var(--emotion-idle-bg)', text: 'var(--emotion-idle-text)' },
      cheerful: { icon: '😊', bg: 'var(--emotion-cheerful-bg)', text: 'var(--emotion-cheerful-text)' },
      blushing: { icon: '😳', bg: 'var(--emotion-blushing-bg)', text: 'var(--emotion-blushing-text)' },
      pouting: { icon: '🧋', bg: 'var(--emotion-pouting-bg)', text: 'var(--emotion-pouting-text)' },
      sad: { icon: '🥺', bg: 'var(--emotion-sad-bg)', text: 'var(--emotion-sad-text)' }
    };

    function setEmotion(emotion) {
      const config = emotionConfig[emotion] || emotionConfig.idle;
      emotionIcon.textContent = config.icon;
      emotionText.textContent = emotion;
      emotionBadge.style.backgroundColor = config.bg;
      emotionBadge.style.color = config.text;
    }

    function appendMessage(sender, text, emotion = null, audioData = null) {
      if (welcomeCard) welcomeCard.style.display = 'none';

      const row = document.createElement('div');
      row.className = `message-row ${sender}`;

      const senderLabel = document.createElement('div');
      senderLabel.className = 'message-sender';

      if (sender === 'bot') {
        senderLabel.textContent = `Miku`;
        if (emotion) {
          const emTag = document.createElement('span');
          emTag.style.opacity = '0.7';
          emTag.textContent = `[${emotion}]`;
          senderLabel.appendChild(emTag);
        }
      } else {
        senderLabel.textContent = 'You';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(senderLabel);
      row.appendChild(bubble);

      if (audioData) {
        const audioBtn = document.createElement('button');
        audioBtn.className = 'play-audio-btn';
        audioBtn.innerHTML = '🔊 Play Voice';
        audioBtn.onclick = () => playAudio(audioData);
        row.appendChild(audioBtn);
      }

      chatMessages.insertBefore(row, typingIndicator);
      scrollToBottom();
    }

    function playAudio(audioBase64) {
      if (!audioBase64) return;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      currentAudio = new Audio(audioBase64);
      audioVisualizer.classList.add('active');
      
      currentAudio.onended = () => {
        audioVisualizer.classList.remove('active');
      };
      currentAudio.onerror = () => {
        audioVisualizer.classList.remove('active');
      };

      currentAudio.play().catch(err => {
        console.log("Audio playback:", err);
        audioVisualizer.classList.remove('active');
      });
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      sendBtn.disabled = true;

      appendMessage('user', text);

      typingIndicator.classList.add('active');
      scrollToBottom();

      try {
        const res = await fetch('/api/chat/miku', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        typingIndicator.classList.remove('active');

        if (res.ok) {
          setEmotion(data.expression);
          appendMessage('bot', data.text, data.expression, data.audio);
          if (data.audio) {
            playAudio(data.audio);
          }
        } else {
          appendMessage('bot', `(Error: ${data.detail || 'Failed to respond'})`);
        }
      } catch (err) {
        typingIndicator.classList.remove('active');
        appendMessage('bot', '(Connection error. Make sure app.py is running.)');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function sendPrompt(text) {
      userInput.value = text;
      handleSend();
    }

    resetBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/reset/miku', { method: 'POST' });
        chatMessages.querySelectorAll('.message-row').forEach(el => el.remove());
        if (welcomeCard) welcomeCard.style.display = 'block';
        setEmotion('idle');
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        audioVisualizer.classList.remove('active');
      } catch (e) {
        console.error("Failed to reset:", e);
      }
    });

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
