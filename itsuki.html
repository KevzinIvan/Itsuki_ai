<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itsuki Nakano — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F7F4EF;
      --bg-card: #FFFFFF;
      --bg-chat: #FAFAF7;
      --border-color: #E6E0D6;
      --text-main: #2C2623;
      --text-muted: #7A726B;
      --accent-red: #C53030;
      --accent-red-hover: #9B2C2C;
      --accent-red-light: #FFF5F5;
      --user-bubble: #2C2623;
      --user-text: #FFFFFF;
      --bot-bubble: #FFFFFF;
      --bot-text: #2C2623;

      --emotion-idle-bg: #EFECE6;
      --emotion-idle-text: #59524B;
      --emotion-cheerful-bg: #FEF3C7;
      --emotion-cheerful-text: #92400E;
      --emotion-blushing-bg: #FCE7F3;
      --emotion-blushing-text: #9D174D;
      --emotion-angry-bg: #FEE2E2;
      --emotion-angry-text: #991B1B;
      --emotion-sad-bg: #E0E7FF;
      --emotion-sad-text: #3730A3;
      --emotion-thinking-bg: #F0FDF4;
      --emotion-thinking-text: #166534;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.page-loaded { opacity: 1; transform: scale(1); }
    body.page-exiting { opacity: 0; transform: scale(0.98) translateY(8px); }

    /* ─── Outer wrapper: sprite panel + chat panel side by side ─── */
    .page-wrapper {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 1440px;
      height: 90vh;
      height: 90dvh;
      align-items: stretch;
    }

    /* ─── LEFT: Sprite / Live Preview Panel ─── */
    .sprite-panel {
      width: 560px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(44, 38, 35, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .sprite-panel-header {
      width: 100%;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border-color);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sprite-panel-header .sprite-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.01em;
    }

    /* keep keyframe but unused now */

    .sprite-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0;
      position: relative;
      overflow: hidden;
      background: url('/itsuki-sprites/apartment.png') center bottom / cover no-repeat;
    }



    .sprite-img {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 95%;
      width: auto;
      object-fit: contain;
      object-position: bottom center;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.12));
    }

    .sprite-img.fade-out {
      opacity: 0;
      transform: translateX(-50%) scale(0.95);
    }

    .sprite-img.fade-in {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .sprite-emotion-label {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    /* ─── RIGHT: App / Chat Panel ─── */
    .app-container {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(44, 38, 35, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ─── */
    .header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      flex-shrink: 0;
    }

    .character-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #C53030, #E53E3E);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(197, 48, 48, 0.25);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FFFFFF;
    }

    .star-clip {
      position: absolute;
      top: -2px;
      right: -2px;
      font-size: 14px;
    }

    .character-details h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .creator-badge {
      font-size: 0.72rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      background: var(--accent-red-light);
      color: var(--accent-red);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(197, 48, 48, 0.2);
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .back-nav-btn {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      line-height: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      background: none;
      transition: all 0.2s ease;
    }

    .back-nav-btn:hover {
      background: var(--bg-main);
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .emotion-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      background-color: var(--emotion-idle-bg);
      color: var(--emotion-idle-text);
      text-transform: capitalize;
    }

    .audio-visualizer {
      display: none;
      align-items: center;
      gap: 3px;
      height: 16px;
    }
    .audio-visualizer.active { display: flex; }

    .audio-bar {
      width: 3px;
      height: 100%;
      background-color: var(--accent-red);
      border-radius: 2px;
      animation: bounce 1s infinite ease-in-out alternate;
    }
    .audio-bar:nth-child(2) { animation-delay: 0.2s; }
    .audio-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: var(--bg-main);
      color: var(--text-main);
      border-color: #D3CBC0;
    }

    /* ─── Chat Messages ─── */
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin: 20px auto;
      max-width: 500px;
    }

    .welcome-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .welcome-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .chip {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background: var(--accent-red-light);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* ─── Bubbles ─── */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { align-self: flex-end; align-items: flex-end; }
    .message-row.bot  { align-self: flex-start; align-items: flex-start; }

    .message-sender {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.93rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .bubble {
      background: var(--bot-bubble);
      color: var(--bot-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .play-audio-btn {
      margin-top: 6px;
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .play-audio-btn:hover { background: var(--accent-red-light); }

    /* ─── Typing indicator ─── */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      gap: 5px;
      align-items: center;
    }
    .typing-indicator.active { display: flex; }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* ─── Footer / Input ─── */
    .footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background: #FFFFFF;
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s ease;
    }
    .input-container:focus-within {
      border-color: var(--accent-red);
      background: #FFFFFF;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text-main);
    }
    input[type="text"]::placeholder { color: var(--text-muted); }

    .send-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .send-btn:hover { background: var(--accent-red-hover); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { background: #D3CBC0; cursor: not-allowed; }

    .credit-tag {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .credit-tag span { font-weight: 600; color: var(--text-main); }

    /* ─── Mobile: sprite on top, chat below ─── */
    @media (max-width: 768px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .page-wrapper {
        flex-direction: column;
        width: 100%;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        gap: 0;
      }

      /* Top sprite preview: ~38% of screen */
      .sprite-panel {
        display: flex;
        width: 100%;
        flex-shrink: 0;
        height: 38vh;
        height: 38dvh;
        border-radius: 0;
        border: none;
        border-bottom: 1px solid var(--border-color);
      }

      /* Hide the "Itsuki" title bar on mobile to maximise sprite space */
      .sprite-panel-header { display: none; }

      /* Emotion label stays but smaller */
      .sprite-emotion-label {
        font-size: 0.7rem;
        padding: 3px 10px;
        bottom: 8px;
      }

      /* Bottom chat panel: fills the rest */
      .app-container {
        flex: 1;
        min-height: 0;
        border-radius: 0;
        border: none;
      }

      /* Tighten header padding on mobile */
      .header {
        padding: 10px 14px;
      }

      /* Compact footer */
      .footer {
        padding: 10px 14px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      /* Hide "Made by Kevin" badge from header on mobile — too cramped */
      .creator-badge { display: none; }

      /* Lock page-level scroll — only the chat messages list scrolls */
      html, body { overflow: hidden; height: 100%; }
      .messages { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- ════ LEFT: Live Preview Sprite Panel ════ -->
    <div class="sprite-panel">
      <div class="sprite-panel-header">
        <span class="sprite-title">Itsuki</span>
      </div>
      <div class="sprite-stage">
        <img
          id="spriteImg"
          class="sprite-img fade-in"
          src="/itsuki-sprites/idle.png"
          alt="Itsuki expression"
        >
        <div class="sprite-emotion-label" id="spriteEmotionLabel">✨ Idle</div>
      </div>
    </div>

    <!-- ════ RIGHT: Chat Panel ════ -->
    <div class="app-container">
      <!-- Header -->
      <div class="header">
        <div class="character-info">
          <a href="selections.html" class="back-nav-btn icon-btn" title="Back to Selection">←</a>
          <div class="avatar-wrapper">
            <img src="/itsuki.jpg" alt="Itsuki Nakano" class="avatar-img">
            <span class="star-clip">⭐</span>
          </div>
          <div class="character-details">
            <h2>Itsuki Nakano <span class="creator-badge">Made by Kevin</span></h2>
            <div class="subtitle">5th Sister • Diligent Food Lover</div>
          </div>
        </div>

        <div class="header-actions">
          <div class="audio-visualizer" id="audioVisualizer" title="Speaking...">
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
          </div>

          <button class="icon-btn" id="resetBtn" title="Reset Conversation">↻ Reset</button>
        </div>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-card" id="welcomeCard">
          <h3 id="welcomeCardTitle">Talk with Itsuki Nakano</h3>
          <p id="welcomeCardSubtitle">Itsuki is happy to study with you! Ask her about her studies, favorite food, or daily life!</p>
          <div class="suggestion-chips">
            <button class="chip" onclick="sendPrompt('Hello Itsuki! Do you know my name?')">Do you know my name? 🌸</button>
            <button class="chip" onclick="sendPrompt('Hello Itsuki! How are you today?')">Hello Itsuki!</button>
            <button class="chip" onclick="sendPrompt('What is your favorite food?')">Favorite food?</button>
            <button class="chip" onclick="sendPrompt('Can we grab meat buns together?')">Meat buns?</button>
          </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- Input Footer -->
      <div class="footer">
        <div class="input-container">
          <input type="text" id="userInput" placeholder="Type a message to Itsuki..." autocomplete="off">
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
        <div class="credit-tag">Made by <span>Kevin</span></div>
      </div>
    </div>

  </div><!-- /.page-wrapper -->

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput    = document.getElementById('userInput');
    const sendBtn      = document.getElementById('sendBtn');
    const typingIndicator  = document.getElementById('typingIndicator');
    const resetBtn         = document.getElementById('resetBtn');
    const welcomeCard      = document.getElementById('welcomeCard');
    const audioVisualizer  = document.getElementById('audioVisualizer');
    const spriteImg        = document.getElementById('spriteImg');
    const spriteLabel      = document.getElementById('spriteEmotionLabel');

    let currentAudio = null;

    // ─── Emotion config ───
    const emotionConfig = {
      idle:     { icon: '⭐', bg: 'var(--emotion-idle-bg)',     text: 'var(--emotion-idle-text)',     sprite: '/itsuki-sprites/idle.png',      label: '✨ Idle'     },
      cheerful: { icon: '😊', bg: 'var(--emotion-cheerful-bg)', text: 'var(--emotion-cheerful-text)', sprite: '/itsuki-sprites/cheerfull.png', label: '😊 Cheerful' },
      blushing: { icon: '😳', bg: 'var(--emotion-blushing-bg)', text: 'var(--emotion-blushing-text)', sprite: '/itsuki-sprites/blush.png',      label: '😳 Blushing' },
      angry:    { icon: '😤', bg: 'var(--emotion-angry-bg)',    text: 'var(--emotion-angry-text)',    sprite: '/itsuki-sprites/annoyed.png',   label: '😤 Annoyed'  },
      sad:      { icon: '🥺', bg: 'var(--emotion-sad-bg)',      text: 'var(--emotion-sad-text)',      sprite: '/itsuki-sprites/idle.png',      label: '🥺 Sad'      },
      thinking: { icon: '🤔', bg: 'var(--emotion-thinking-bg)', text: 'var(--emotion-thinking-text)', sprite: '/itsuki-sprites/thinking.png',  label: '🤔 Thinking' },
    };

    // ─── Sprite switcher with crossfade ───
    function setSprite(emotion) {
      const cfg = emotionConfig[emotion] || emotionConfig.idle;

      spriteImg.classList.remove('fade-in');
      spriteImg.classList.add('fade-out');

      spriteLabel.textContent = cfg.label;

      setTimeout(() => {
        // Set onload BEFORE src so cached images don't miss the event
        spriteImg.onload = () => {
          spriteImg.classList.remove('fade-out');
          spriteImg.classList.add('fade-in');
        };
        spriteImg.onerror = () => {
          spriteImg.classList.remove('fade-out');
          spriteImg.classList.add('fade-in');
        };
        spriteImg.src = cfg.sprite;
        // If image was already cached, complete is true immediately after src assignment
        if (spriteImg.complete) {
          spriteImg.classList.remove('fade-out');
          spriteImg.classList.add('fade-in');
        }
      }, 200);
    }

    // ─── Emotion ───
    function setEmotion(emotion) {
      setSprite(emotion);
    }

    // ─── User Session Initialization ───
    const currentUsername = (localStorage.getItem('nakano_username') || localStorage.getItem('username') || '').trim();
    if (!currentUsername) {
      window.location.href = 'login.html';
    } else {
      const welcomeTitle = document.getElementById('welcomeCardTitle');
      const welcomeSubtitle = document.getElementById('welcomeCardSubtitle');
      if (welcomeTitle) welcomeTitle.textContent = `Welcome, ${currentUsername}! Meet Itsuki`;
      if (welcomeSubtitle) welcomeSubtitle.textContent = `Itsuki knows you as ${currentUsername}. Ask her anything or talk about studies & food!`;
    }

    // ─── Append message ───
    function appendMessage(sender, text, emotion = null, audioData = null) {
      if (welcomeCard) welcomeCard.style.display = 'none';

      const row = document.createElement('div');
      row.className = `message-row ${sender}`;

      const senderLabel = document.createElement('div');
      senderLabel.className = 'message-sender';

      if (sender === 'bot') {
        senderLabel.textContent = 'Itsuki';
        if (emotion) {
          const emTag = document.createElement('span');
          emTag.style.opacity = '0.7';
          emTag.textContent = `[${emotion}]`;
          senderLabel.appendChild(emTag);
        }
      } else {
        senderLabel.textContent = currentUsername || 'You';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(senderLabel);
      row.appendChild(bubble);

      if (audioData) {
        const audioBtn = document.createElement('button');
        audioBtn.className = 'play-audio-btn';
        audioBtn.innerHTML = '🔊 Play Voice';
        audioBtn.onclick = () => playAudio(audioData);
        row.appendChild(audioBtn);
      }

      chatMessages.insertBefore(row, typingIndicator);
      scrollToBottom();
    }

    // ─── Audio ───
    function playAudio(audioBase64) {
      if (!audioBase64) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      currentAudio = new Audio(audioBase64);
      audioVisualizer.classList.add('active');
      currentAudio.onended = () => audioVisualizer.classList.remove('active');
      currentAudio.onerror = () => audioVisualizer.classList.remove('active');
      currentAudio.play().catch(() => audioVisualizer.classList.remove('active'));
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ─── Send ───
    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      sendBtn.disabled = true;
      appendMessage('user', text);
      typingIndicator.classList.add('active');
      scrollToBottom();

      try {
        const res  = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, username: currentUsername })
        });
        const data = await res.json();
        typingIndicator.classList.remove('active');

        if (res.ok) {
          setEmotion(data.expression);
          appendMessage('bot', data.text, data.expression, data.audio);
          if (data.audio) playAudio(data.audio);
        } else {
          appendMessage('bot', `(Error: ${data.detail || 'Failed to respond'})`);
        }
      } catch (err) {
        typingIndicator.classList.remove('active');
        appendMessage('bot', '(Connection error. Make sure app.py is running.)');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function sendPrompt(text) {
      userInput.value = text;
      handleSend();
    }

    // ─── Reset ───
    resetBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/reset', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUsername })
        });
        chatMessages.querySelectorAll('.message-row').forEach(el => el.remove());
        if (welcomeCard) welcomeCard.style.display = 'block';
        setEmotion('idle');
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        audioVisualizer.classList.remove('active');
      } catch (e) { console.error('Failed to reset:', e); }
    });

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

    // ─── Page transitions ───
    window.addEventListener('DOMContentLoaded', () => document.body.classList.add('page-loaded'));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      document.body.classList.add('page-loaded');
    }

    document.querySelectorAll('.back-nav-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.remove('page-loaded');
        document.body.classList.add('page-exiting');
        setTimeout(() => {
          window.location.href = btn.getAttribute('href') || 'selections.html';
        }, 300);
      });
    });
  </script>
</body>
</html>
